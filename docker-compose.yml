services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: talentflow
      POSTGRES_USER: talentflow
      POSTGRES_PASSWORD: talentflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: change-this-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost"
      DB_ENGINE: postgresql
      DB_NAME: talentflow
      DB_USER: talentflow
      DB_PASSWORD: talentflow
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - db
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
volumes:
  postgres_data:
